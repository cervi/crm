services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Aplica las migraciones pendientes y termina.
  migrate:
    build:
      context: .
      target: deps          # reutiliza la etapa con node_modules del Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crm:crm@db:5432/crm
    volumes:
      - ./db:/app/db:ro
      - ./scripts:/app/scripts:ro
    command: ["node", "scripts/db.mjs", "migrate"]

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://crm:crm@db:5432/crm
    ports:
      - "3000:3000"

volumes:
  pgdata:
