services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Aplica las migraciones pendientes y termina.
  migrate:
    build:
      context: .
      target: deps          # reutiliza la etapa con node_modules del Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crm:crm@db:5432/crm
    volumes:
      - ./db:/app/db:ro
      - ./scripts:/app/scripts:ro
    command: ["node", "scripts/db.mjs", "migrate"]

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://crm:crm@db:5432/crm
      TZ: ${TZ:-Europe/Madrid}
      AUTOMATIONS_INTERVAL_MINUTES: ${AUTOMATIONS_INTERVAL_MINUTES:-15}
      CRON_SECRET: ${CRON_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      APP_URL: ${APP_URL:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Define BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?Define BASIC_AUTH_PASSWORD}
      INBOUND_API_KEYS: ${INBOUND_API_KEYS:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
